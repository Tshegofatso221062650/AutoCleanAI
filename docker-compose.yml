services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev-docker-secret-change-me
      - AUTOCLEAN_PASSWORD=changeme
      - AI_PROVIDER=none
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./history:/app/history

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
